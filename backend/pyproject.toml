[project]
name = "fintech-backend"
version = "0.1.0"
description = "Backend of the fintech MVP: API, ledger, partner integrations"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "A", "C4", "DTZ", "T20", "SIM", "RET", "PT",
  "ASYNC", "TID", "RUF", "PL", "PERF", "FBT",
  "C90", "ERA", "ARG", "BLE", "PIE",
]
ignore = [
  "PLR0913", # too many arguments: explicit keyword arguments are fine in services
  "PERF401", # comprehension vs loop is a readability call
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"migrations/**" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

# Coverage is enforced by `make backend-test` (pytest --cov); a plain `pytest` run skips it.
[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/asgi.py"] # uvicorn entrypoint, one line, exercised by `make dev`

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
